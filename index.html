<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>CAP ORIENTATION — Devenir partenaire</title>
<style>
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
  }
</style>
</head>
<body>
<div id="cap-root"></div>
<style>
  #cap-root {
    --blue: #1B3E7D;
    --blue-deep: #12294F;
    --orange: #F5A623;
    --sand: #FAF6EF;
    --ink: #23262B;
    --ink-soft: #5B6472;
    --line: #DDD4C2;
    --green: #3F8F5F;
    --red: #B3452F;

    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--sand);
    max-width: 620px;
    margin: 0 auto;
    padding: 36px 28px 48px;
    box-sizing: border-box;
    line-height: 1.5;
  }
  #cap-root * { box-sizing: border-box; }

  .cap-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
  }
  .cap-brand img { height: 44px; width: auto; flex: none; }
  .cap-brand .brand-text { display: flex; flex-direction: column; line-height: 1.25; }
  .cap-brand .brand-text b { font-size: 14px; color: var(--blue-deep); }
  .cap-brand .brand-text span { font-size: 11.5px; letter-spacing: 0.02em; color: var(--ink-soft); }

  .cap-title {
    font-size: 30px;
    font-weight: 800;
    color: var(--blue-deep);
    margin: 6px 0 2px;
    letter-spacing: -0.01em;
  }
  .cap-sub {
    font-size: 16px;
    color: var(--orange);
    font-style: italic;
    margin: 0 0 28px;
  }

  .cap-intro {
    font-size: 15px;
    color: var(--ink-soft);
    margin-bottom: 24px;
    border-left: 3px solid var(--orange);
    padding-left: 14px;
  }

  .cap-offer {
    display: flex;
    gap: 14px;
    margin-bottom: 30px;
  }
  .cap-offer > div {
    flex: 1;
    background: #fff;
    border: 1px solid var(--line);
    padding: 14px 12px;
  }
  .cap-offer h4 {
    margin: 0 0 6px;
    font-size: 12.5px;
    color: var(--blue-deep);
  }
  .cap-offer p {
    margin: 0;
    font-size: 12px;
    color: var(--ink-soft);
  }

  fieldset { border: none; padding: 0; margin: 0 0 26px; }
  .cap-row { display: flex; gap: 18px; }
  .cap-row > div { flex: 1; }

  .field { margin-bottom: 20px; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: var(--blue-deep);
    margin-bottom: 6px;
  }
  .field .hint { font-weight: 400; color: var(--ink-soft); font-size: 12px; }
  .field input[type="text"],
  .field input[type="tel"],
  .field input[type="email"],
  .field select,
  .field textarea {
    width: 100%;
    font-size: 16px;
    font-family: inherit;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 1.5px solid var(--line);
    padding: 8px 2px;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-bottom-color: var(--orange); }
  .field textarea { resize: vertical; min-height: 64px; }

  .cap-choices { display: flex; flex-wrap: wrap; gap: 10px; }
  .cap-choice {
    border: 1.5px solid var(--line);
    padding: 9px 14px;
    font-size: 13.5px;
    cursor: pointer;
    user-select: none;
    color: var(--ink);
    background: #fff;
    transition: all 0.12s ease;
  }
  .cap-choice input { display: none; }
  .cap-choice.checked { border-color: var(--blue); background: var(--blue); color: #fff; }

  .cap-consent {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 13.5px;
    color: var(--ink-soft);
    margin-bottom: 28px;
  }
  .cap-consent input { margin-top: 3px; flex: none; }

  .cap-submit {
    width: 100%;
    background: var(--orange);
    color: var(--blue-deep);
    border: none;
    font-size: 16px;
    font-weight: 800;
    padding: 15px;
    cursor: pointer;
    letter-spacing: 0.01em;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  .cap-submit:hover { background: #E4961A; }
  .cap-submit:active { transform: scale(0.99); }
  .cap-submit:disabled { opacity: 0.6; cursor: default; }

  .cap-error {
    color: var(--red);
    font-size: 13px;
    margin-top: -10px;
    margin-bottom: 18px;
    display: none;
  }

  .cap-confirm { display: none; text-align: center; padding: 20px 0 10px; }
  .cap-confirm .dot-big {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--green);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 28px;
  }
  .cap-confirm h2 { color: var(--blue-deep); font-size: 22px; margin: 0 0 10px; }
  .cap-confirm p { color: var(--ink-soft); font-size: 14.5px; max-width: 440px; margin: 0 auto 8px; }
  .cap-confirm .ref {
    display: inline-block;
    margin-top: 14px;
    font-size: 12.5px;
    color: var(--ink-soft);
    border: 1px dashed var(--line);
    padding: 6px 12px;
  }

  .cap-team {
    margin-top: 44px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    text-align: center;
  }
  .cap-team a { font-size: 12px; color: var(--ink-soft); text-decoration: underline; cursor: pointer; }
  .cap-admin { display: none; margin-top: 20px; }
  .cap-admin table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .cap-admin th, .cap-admin td {
    border-bottom: 1px solid var(--line);
    padding: 6px 4px;
    text-align: left;
    vertical-align: top;
  }
  .cap-admin th { color: var(--blue-deep); }
  .cap-admin .admin-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; font-size: 12.5px; color: var(--ink-soft);
  }
  .cap-admin button {
    font-size: 12px; padding: 6px 10px; border: 1px solid var(--line);
    background: #fff; cursor: pointer; color: var(--blue-deep);
  }
</style>

  root.innerHTML = `
    <div class="cap-brand">
      <img src="data:image/png;base64,${LOGO_B64}" alt="Logo PIRA LAB Consulting">
      <div class="brand-text"><b>PIRA LAB CONSULTING</b><span>EduLab — Programme CAP ORIENTATION</span></div>
    </div>
    <div class="cap-title">Devenir partenaire</div>
    <div class="cap-sub">CAP ORIENTATION — Proposition de partenariat</div>

    <div class="cap-intro">
      CAP ORIENTATION est un programme d'accompagnement à l'orientation pour bacheliers,
      étudiants et jeunes diplômés : 2 jours d'ateliers présentiels suivis de 4 semaines de
      suivi individuel sur WhatsApp. Nous cherchons une structure partenaire pour notre
      édition pilote (20 à 30 jeunes).
    </div>

    <div class="cap-offer">
      <div>
        <h4>Votre rôle</h4>
        <p>Mobiliser les jeunes bénéficiaires et faciliter la communication auprès d'eux.</p>
      </div>
      <div>
        <h4>Notre rôle</h4>
        <p>Conception, animation, suivi individuel et rapport final — à coût opérationnel minimal pour vous.</p>
      </div>
    </div>

    <form id="capForm" novalidate>
      <div class="field">
        <label for="orga">Nom de votre structure</label>
        <input type="text" id="orga" required>
      </div>

      <div class="cap-row">
        <div class="field">
          <label for="type">Type de structure</label>
          <select id="type" required>
            <option value="" disabled selected>Sélectionner...</option>
            <option>Association</option>
            <option>ONG</option>
            <option>Établissement scolaire / université</option>
            <option>Institution publique</option>
            <option>Entreprise</option>
            <option>Autre</option>
          </select>
        </div>
        <div class="field">
          <label for="ville">Ville / zone d'intervention</label>
          <input type="text" id="ville" placeholder="Ex : N'Djamena" required>
        </div>
      </div>

      <div class="cap-row">
        <div class="field">
          <label for="contact">Nom du contact</label>
          <input type="text" id="contact" required>
        </div>
        <div class="field">
          <label for="fonction">Fonction du contact</label>
          <input type="text" id="fonction" placeholder="Ex : Coordinateur, Directeur...">
        </div>
      </div>

      <div class="cap-row">
        <div class="field">
          <label for="tel">Téléphone <span class="hint">— idéalement joignable sur WhatsApp</span></label>
          <input type="tel" id="tel" required placeholder="+235 6X XX XX XX">
        </div>
        <div class="field">
          <label for="email">Email <span class="hint">(facultatif)</span></label>
          <input type="email" id="email">
        </div>
      </div>

      <div class="field">
        <label for="effectif">Nombre de jeunes que vous pourriez mobiliser</label>
        <input type="text" id="effectif" placeholder="Ex : une vingtaine">
      </div>

      <div class="field">
        <label>Disponibilité préférée pour les 2 jours d'ateliers</label>
        <div class="cap-choices" id="dispoChoices">
          <label class="cap-choice"><input type="radio" name="dispo" value="Vendredi – Samedi">Vendredi – Samedi</label>
          <label class="cap-choice"><input type="radio" name="dispo" value="Samedi – Dimanche">Samedi – Dimanche</label>
          <label class="cap-choice"><input type="radio" name="dispo" value="Indifférent">Indifférent</label>
        </div>
        <div class="cap-error" id="errDispo">Merci de choisir une disponibilité.</div>
      </div>

      <div class="field">
        <label for="message">Présentez brièvement votre structure et votre intérêt pour ce partenariat</label>
        <textarea id="message"></textarea>
      </div>

      <label class="cap-consent">
        <input type="checkbox" id="consent" required>
        <span>Notre structure s'engage, en cas de partenariat, à mobiliser les jeunes bénéficiaires et à faciliter la communication et la coordination avec PIRA LAB, selon les modalités qui seront précisées dans une convention de partenariat.</span>
      </label>
      <div class="cap-error" id="errConsent">Ce consentement est nécessaire pour soumettre la demande.</div>

      <button type="submit" class="cap-submit" id="submitBtn">Envoyer notre demande de partenariat</button>
    </form>

    <div class="cap-confirm" id="capConfirm">
      <div class="dot-big">✓</div>
      <h2>Demande bien reçue</h2>
      <p>Merci pour votre intérêt ! PIRA LAB CONSULTING va étudier votre demande et vous
      recontacter directement pour organiser un échange et préciser les modalités du partenariat pilote.</p>
      <div class="ref" id="refCode"></div>
    </div>

    <div class="cap-team">
      <a id="teamLink">Espace équipe PIRA LAB</a>
      <div class="cap-admin" id="capAdmin">
        <div class="admin-bar">
          <span id="adminCount">0 demande(s)</span>
          <button id="refreshBtn" type="button">Actualiser</button>
        </div>
        <table>
          <thead><tr><th>Structure</th><th>Type</th><th>Contact</th><th>Tél.</th><th>Effectif</th><th>Dispo.</th><th>Date</th></tr></thead>
          <tbody id="adminBody"></tbody>
        </table>
      </div>
    </div>
  `;

  const dispoWrap = root.querySelector('#dispoChoices');
  dispoWrap.addEventListener('click', (e) => {
    const label = e.target.closest('.cap-choice');
    if (!label) return;
    dispoWrap.querySelectorAll('.cap-choice').forEach(c => c.classList.remove('checked'));
    label.classList.add('checked');
  });

  const form = root.querySelector('#capForm');
  const submitBtn = root.querySelector('#submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const orga = root.querySelector('#orga').value.trim();
    const type = root.querySelector('#type').value;
    const ville = root.querySelector('#ville').value.trim();
    const contact = root.querySelector('#contact').value.trim();
    const fonction = root.querySelector('#fonction').value.trim();
    const tel = root.querySelector('#tel').value.trim();
    const email = root.querySelector('#email').value.trim();
    const effectif = root.querySelector('#effectif').value.trim();
    const dispoInput = root.querySelector('input[name="dispo"]:checked');
    const message = root.querySelector('#message').value.trim();
    const consent = root.querySelector('#consent').checked;

    let valid = form.reportValidity();

    root.querySelector('#errDispo').style.display = dispoInput ? 'none' : 'block';
    root.querySelector('#errConsent').style.display = consent ? 'none' : 'block';
    if (!dispoInput || !consent) valid = false;
    if (!valid) return;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Envoi en cours...';

    const record = {
      orga, type, ville, contact, fonction, tel, email, effectif,
      dispo: dispoInput.value,
      message,
      date: new Date().toISOString(),
    };
    const key = `partenaires:${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;

    try {
      await window.storage.set(key, JSON.stringify(record), true);
      form.style.display = 'none';
      root.querySelector('#capConfirm').style.display = 'block';
      root.querySelector('#refCode').textContent = 'Référence : ' + key.split(':')[1];
    } catch (err) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Envoyer notre demande de partenariat';
      alert("L'enregistrement a échoué, merci de réessayer dans un instant.");
    }
  });

  const teamLink = root.querySelector('#teamLink');
  const adminPanel = root.querySelector('#capAdmin');
  let unlocked = false;

  async function loadSubmissions() {
    const body = root.querySelector('#adminBody');
    const countEl = root.querySelector('#adminCount');
    body.innerHTML = '<tr><td colspan="7">Chargement...</td></tr>';
    try {
      const list = await window.storage.list('partenaires:', true);
      const keys = (list && list.keys) || [];
      const rows = [];
      for (const k of keys) {
        try {
          const res = await window.storage.get(k, true);
          if (res && res.value) rows.push(JSON.parse(res.value));
        } catch (e) { /* skip unreadable entry */ }
      }
      rows.sort((a, b) => new Date(b.date) - new Date(a.date));
      countEl.textContent = rows.length + ' demande(s)';
      body.innerHTML = rows.length ? rows.map(r => `
        <tr>
          <td>${escapeHtml(r.orga)}</td>
          <td>${escapeHtml(r.type || '')}</td>
          <td>${escapeHtml(r.contact || '')}${r.fonction ? ' (' + escapeHtml(r.fonction) + ')' : ''}</td>
          <td>${escapeHtml(r.tel || '')}</td>
          <td>${escapeHtml(r.effectif || '')}</td>
          <td>${escapeHtml(r.dispo || '')}</td>
          <td>${new Date(r.date).toLocaleDateString('fr-FR')}</td>
        </tr>
      `).join('') : '<tr><td colspan="7">Aucune demande pour le moment.</td></tr>';
    } catch (e) {
      body.innerHTML = '<tr><td colspan="7">Aucune demande pour le moment.</td></tr>';
      countEl.textContent = '0 demande(s)';
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  teamLink.addEventListener('click', () => {
    if (!unlocked) {
      const code = prompt("Code d'accès équipe :");
      if (code !== 'PIRALAB2026') {
        if (code !== null) alert('Code incorrect.');
        return;
      }
      unlocked = true;
    }
    const showing = adminPanel.style.display === 'block';
    adminPanel.style.display = showing ? 'none' : 'block';
    if (!showing) loadSubmissions();
  });

  root.querySelector('#refreshBtn').addEventListener('click', loadSubmissions);
})();
</script>

</body>
